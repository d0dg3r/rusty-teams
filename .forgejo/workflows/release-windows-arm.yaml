# Forgejo: Windows ARM64 — forgejo-runner-win-02 (label windows-arm64).

name: Release (Windows ARM)

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: release-windows-arm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-arm:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-arm64
    timeout-minutes: 180
    env:
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      GIT_SSL_NO_VERIFY: "true"
      NODE_OPTIONS: --dns-result-order=ipv4first
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.forgejo/actions/setup-windows

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p app --release \
            --config "patch.crates-io.gpui-pre-windows.path=\"$GPUI_PRE_WINDOWS_PATCHED\""

      - name: Stage asset
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            ver="0.0.0-dev"
          fi
          mkdir -p dist
          cp target/release/teams.exe "dist/rusty-teams-${ver}-windows-arm64.exe"
          ls -la dist/

      - name: Publish Forgejo + GitHub mirror
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NAME: ${{ github.ref_name }}
          RELEASE_PRERELEASE: ${{ contains(github.ref_name, '-') }}
          RELEASE_TARGET: ${{ github.sha }}
          RELEASE_FILES: dist/*.exe
          GITHUB_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GITHUB_MIRROR_REPO: d0dg3r/rusty-teams
        run: scripts/ci_forgejo_publish_release.sh

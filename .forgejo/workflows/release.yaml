# Tag v* → Linux-Pakete + Windows amd64/ARM64 + macOS universal auf Homelab-Runnern.
# Assets: Forgejo-Release + Spiegel nach d0dg3r/rusty-teams (GITHUB_MIRROR_TOKEN).

name: Release

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "all oder Komma-Liste: linux,windows,windows-arm,macos"
        type: string
        required: false
        default: all
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.out.outputs.linux }}
      windows: ${{ steps.out.outputs.windows }}
      windows_arm: ${{ steps.out.outputs.windows_arm }}
      macos: ${{ steps.out.outputs.macos }}
    steps:
      - id: out
        env:
          PLATFORMS: ${{ github.event.inputs.platforms || 'all' }}
        run: |
          set -euo pipefail
          platforms="${PLATFORMS:-all}"
          platforms="${platforms// /}"
          [[ -n "$platforms" ]] || platforms=all
          want() {
            local key="$1"
            if [[ "$platforms" == "all" ]]; then
              echo true
              return
            fi
            IFS=',' read -r -a parts <<< "$platforms"
            local p
            for p in "${parts[@]}"; do
              [[ "$p" == "$key" ]] && { echo true; return; }
            done
            echo false
          }
          {
            echo "linux=$(want linux)"
            echo "windows=$(want windows)"
            echo "windows_arm=$(want windows-arm)"
            echo "macos=$(want macos)"
          } >> "$GITHUB_OUTPUT"

  linux:
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    uses: ./.forgejo/workflows/release-linux.yaml

  windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    uses: ./.forgejo/workflows/release-windows.yaml

  windows_arm:
    needs: plan
    if: needs.plan.outputs.windows_arm == 'true'
    uses: ./.forgejo/workflows/release-windows-arm.yaml

  macos:
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    uses: ./.forgejo/workflows/release-macos.yaml

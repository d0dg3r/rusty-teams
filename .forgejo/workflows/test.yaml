# Forgejo: cargo test on push to main. GitHub runs no CI — mirror only.

name: Test

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: Which test jobs to run
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openspec-gate:
    name: OpenSpec gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: OpenSpec required for behaviour crates
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          if [[ -z "${base:-}" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git merge-base HEAD origin/main 2>/dev/null || git rev-parse HEAD~1)"
          fi
          scripts/check-openspec-gate.sh "$base"

  linux:
    name: Linux
    needs: [openspec-gate]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'linux' }}
    # ci-runner-linux-01..03 (16 GiB each) all advertise ubuntu-latest.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CC: clang-21
      CXX: clang++-21
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang-21
      # Parallel clang links of app/GPUI still SIGBUS on 16 GiB runners; cap jobs.
      CARGO_BUILD_JOBS: "2"
      NODE_OPTIONS: --dns-result-order=ipv4first
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: ./.forgejo/actions/setup-linux

      - uses: ./.forgejo/actions/setup-rust

      - name: Tests
        run: cargo test -j2

  windows:
    name: Windows
    needs: [openspec-gate]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'windows' }}
    runs-on: ci-runner-windows-01
    timeout-minutes: 90
    env:
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      GIT_SSL_NO_VERIFY: "true"
      NODE_OPTIONS: --dns-result-order=ipv4first
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: ./.forgejo/actions/setup-rust

      - uses: ./.forgejo/actions/setup-windows

      - name: Tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test \
            --config "patch.crates-io.gpui-pre-windows.path=\"$GPUI_PRE_WINDOWS_PATCHED\""

  macos:
    name: macOS
    needs: [openspec-gate]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'macos' }}
    runs-on: macos-arm64
    timeout-minutes: 90
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      NODE_OPTIONS: --dns-result-order=ipv4first
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: ./.forgejo/actions/setup-rust

      - name: Tests
        run: cargo test
        # Live ScreenCaptureKit / managed-browser smokes stay on docs/macos-smoke.md;
        # unit tests cover picker frames, browser discovery, and shared call paths.
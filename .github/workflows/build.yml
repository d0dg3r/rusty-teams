# Release-Binaries entstehen auf Forgejo (.forgejo/workflows/release*.yaml)
# und werden nach GitHub gespiegelt. Dieser Workflow baut nicht mehr —
# siehe GITHUB_RELEASE.md.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skipped:
    name: Builds moved to Forgejo
    runs-on: ubuntu-latest
    steps:
      - name: Point to Forgejo SoT
        run: |
          echo "Release compiles run on Forgejo (devops-geek/rusty-teams)."
          echo "Assets are mirrored to this GitHub repo via GITHUB_MIRROR_TOKEN."
          echo "See GITHUB_RELEASE.md"

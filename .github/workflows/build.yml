# GitHub is Offsite-Spiegel only. CI and releases run on Forgejo
# (devops-geek/rusty-teams → .forgejo/workflows/). This file exists so a
# mirrored empty .github/workflows/ does not confuse forks; it never runs
# compile or test jobs.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skipped:
    name: Builds and tests run on Forgejo
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "SoT: https://forgejo.lan/devops-geek/rusty-teams"
          echo "See GITHUB_RELEASE.md — GitHub is mirror only."

# One-shot: Windows ARM64 when Homelab win-02 is offline.
# Delete after smoke; permanent path remains Forgejo label windows-arm64.
name: Smoke Windows ARM64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the exe to"
        type: string
        required: true
        default: v0.3.0-joe.1

permissions:
  contents: write

concurrency:
  group: smoke-windows-arm
  cancel-in-progress: true

jobs:
  windows-arm:
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/setup-windows

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p app --release \
            --config "patch.crates-io.gpui-pre-windows.path=\"$GPUI_PRE_WINDOWS_PATCHED\""

      - name: Stage + upload to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          mkdir -p dist
          asset="dist/rusty-teams-${ver}-windows-arm64.exe"
          cp target/release/teams.exe "$asset"
          ls -la dist/
          gh release upload "$TAG" "$asset" --clobber
